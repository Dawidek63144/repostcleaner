<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Repost Cleaner — returning to the app</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, "SF Pro Rounded", Helvetica, Arial, sans-serif;
         background:#0b0b0f; color:#fff; display:flex; align-items:center;
         justify-content:center; min-height:90vh; margin:0; text-align:center; }
  .box { max-width:26rem; padding:2rem; }
  h1 { font-size:1.4rem; margin:0 0 .75rem; }
  p  { color:#92929e; line-height:1.5; }
</style>
</head>
<body>
<div class="box">
  <h1>Authorization complete 🎉</h1>
  <p>Returning to <strong>Repost Cleaner</strong>… You can close this page.</p>
  <p class="hint" id="hint" style="color:#62626e; font-size:.85rem;"></p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var out = new URLSearchParams();

  // Forward everything TikTok sent us to the app's custom scheme.
  ["code", "state", "scopes", "error", "error_description", "error_uri"].forEach(function (k) {
    var v = q.get(k);
    if (v) out.set(k, v);
  });

  // Normalize bare error codes into error_description, which the app reads.
  if (q.get("error") && !q.get("error_description")) {
    out.set("error_description", q.get("error"));
  }
  if (q.get("code") && !q.get("error_description")) {
    out.set("error_description", "");
  }

  var target = "repostcleaner://oauth/callback";
  var qs = out.toString();
  if (qs) target += "?" + qs;

  var hint = document.getElementById("hint");
  if (!q.get("code") && !q.get("error")) {
    hint.textContent = "No authorization parameters were passed — open Repost Cleaner and start connecting again.";
    return;
  }
  location.replace(target);
})();
</script>
</body>
</html>
