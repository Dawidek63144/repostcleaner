<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Powrót do Repost Cleaner</title>
  <style>
    body { font: 16px -apple-system, BlinkMacSystemFont, sans-serif; margin: 3rem auto; max-width: 34rem; padding: 0 1.25rem; color: #222; }
  </style>
</head>
<body>
  <h1>Wracanie do aplikacji…</h1>
  <p id="status">Jeśli aplikacja się nie otworzy, wróć do niej ręcznie.</p>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const callback = new URL('repostcleaner://oauth/callback');

      for (const key of ['code', 'state', 'error', 'error_description']) {
        const value = params.get(key);
        if (value !== null) callback.searchParams.set(key, value);
      }

      if (!params.has('code') && !params.has('error')) {
        document.getElementById('status').textContent =
          'TikTok nie zwrócił kodu logowania. Wróć do aplikacji i spróbuj ponownie.';
        return;
      }

      window.location.replace(callback.toString());
    })();
  </script>
</body>
</html>
